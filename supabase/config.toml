# Supabase Local CLI Configuration
project_id = "quartett-game"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "http://localhost:*", "http://localhost:*/*"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.anonymous_users]
enable = true # Erlaubt anonymer Gast-Login ohne Registrierung!

[auth.external.google]
enabled = true
client_id = "DEVELOPMENT_CLIENT_ID"
secret = "DEVELOPMENT_SECRET"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true
ip_version = "IPv4"
