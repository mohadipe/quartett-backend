name: Supabase Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-database:
    name: PostgreSQL Schema, Security & RLS Coverage (pgTAP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Containers
        run: supabase start

      - name: Run pgTAP Contract Regression Tests (v1 & v2)
        run: supabase test db supabase/tests/contracts

      - name: Run pgTAP Database & RLS Tests
        run: supabase test db

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: "📦 Install Python Test Dependencies"
        run: pip install -r requirements.txt

      - name: "🧪 Run Workflow & Script Unit Tests"
        run: python3 -m unittest discover tests

      - name: Generate Backend Security & Coverage Summary
        run: ./scripts/generate_backend_summary.sh >> $GITHUB_STEP_SUMMARY
