name: "🚀 Supabase Backend Deployment Pipeline"

'on':
  push:
    branches:
      - main
    tags:
      - 'backend-v*'
  workflow_dispatch:
    inputs:
      environment:
        description: "Zielumgebung für Deployment (staging oder production)"
        required: true
        type: choice
        options:
          - staging
          - production
        default: "staging"

jobs:
  # =========================================================================
  # JOB 1: STAGING DEPLOYMENT (quartett-stage)
  # Triggers: Push auf main ODER manual dispatch mit environment == 'staging'
  # =========================================================================
  staging:
    name: "🟡 Job 1: Staging Deployment (quartett-stage)"
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING || secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF_STAGING: ${{ secrets.SUPABASE_PROJECT_REF_STAGING || vars.SUPABASE_PROJECT_REF_STAGING }}
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "⚡ Setup Supabase CLI"
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: "🐳 Start Supabase Local Containers"
        run: supabase start

      - name: "🧪 Run pgTAP Database & RLS Tests"
        run: supabase test db

      - name: "📊 Generate Backend Security & Coverage Summary"
        run: ./scripts/generate_backend_summary.sh >> $GITHUB_STEP_SUMMARY

      - name: "🚀 Deploy Migrations to Staging (quartett-stage)"
        id: deploy_staging
        run: |
          echo "=== 🚀 Starting Staging Database Deployment ==="
          if [ -z "$SUPABASE_PROJECT_REF_STAGING" ]; then
            echo "::error::SUPABASE_PROJECT_REF_STAGING secret or variable is not set!"
            exit 1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set!"
            exit 1
          fi

          echo "🔗 Linking to Supabase Staging project ($SUPABASE_PROJECT_REF_STAGING)..."
          supabase link --project-ref "$SUPABASE_PROJECT_REF_STAGING"

          echo "📤 Applying migrations via supabase db push..."
          set -o pipefail
          if supabase db push --help 2>&1 | grep -q -- '--project-ref'; then
            supabase db push --project-ref "$SUPABASE_PROJECT_REF_STAGING" 2>&1 | tee /tmp/supabase_push_staging.log
          else
            supabase db push 2>&1 | tee /tmp/supabase_push_staging.log
          fi
          echo "✅ Staging database deployment completed."

      - name: "📢 Generate Staging Deployment Summary"
        if: always() && steps.deploy_staging.conclusion != 'skipped'
        run: |
          echo "## 🚀 Supabase Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Wert |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ziel-Umgebung** | \`quartett-stage\` (Staging) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Project Ref** | \`${{ secrets.SUPABASE_PROJECT_REF_STAGING || vars.SUPABASE_PROJECT_REF_STAGING || 'Nicht konfiguriert' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auslöser (Event)** | \`${{ github.event_name }}\` (\`${{ github.ref_name }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment-Status** | ${{ steps.deploy_staging.outcome == 'success' && '🟢 Erfolgreich deployt' || '❌ Fehler beim Deployment' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/supabase_push_staging.log ]; then
            echo "### 📜 Status der Migrationen & CLI Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat /tmp/supabase_push_staging.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # JOB 2: PRODUCTION DEPLOYMENT (quartett-prod)
  # Triggers: Git-Tag backend-v* ODER manual dispatch mit environment == 'production'
  # =========================================================================
  production:
    name: "🔴 Job 2: Production Deployment (quartett-prod)"
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/backend-v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD || vars.SUPABASE_PROJECT_REF_PROD }}
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "⚡ Setup Supabase CLI"
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: "🐳 Start Supabase Local Containers"
        run: supabase start

      - name: "🧪 Run pgTAP Database & RLS Tests"
        run: supabase test db

      - name: "📊 Generate Backend Security & Coverage Summary"
        run: ./scripts/generate_backend_summary.sh >> $GITHUB_STEP_SUMMARY

      - name: "💾 Automated Production Database Backup"
        id: backup_prod
        run: |
          echo "=== 💾 Creating Automated Production Database Backup ==="
          if [ -z "$SUPABASE_PROJECT_REF_PROD" ]; then
            echo "::error::SUPABASE_PROJECT_REF_PROD secret or variable is not set!"
            exit 1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set!"
            exit 1
          fi

          echo "🔗 Linking to Supabase Production project ($SUPABASE_PROJECT_REF_PROD)..."
          supabase link --project-ref "$SUPABASE_PROJECT_REF_PROD"

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_DIR="backups/prod_${TIMESTAMP}"
          mkdir -p "$BACKUP_DIR"

          echo "Dumping database schema to ${BACKUP_DIR}/schema.sql..."
          supabase db dump --linked -f "${BACKUP_DIR}/schema.sql"

          echo "Dumping database data to ${BACKUP_DIR}/data.sql..."
          supabase db dump --linked --data-only --use-copy -f "${BACKUP_DIR}/data.sql" || {
            echo "ℹ️ Note: Data dump returned non-zero (schema dump intact, proceeding)."
          }

          echo "backup_dir=$BACKUP_DIR" >> $GITHUB_OUTPUT
          echo "backup_timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "✅ Backup successfully created in $BACKUP_DIR."

      - name: "📤 Upload Production Database Backup Artifact"
        uses: actions/upload-artifact@v4
        if: steps.backup_prod.outcome == 'success'
        with:
          name: quartett-prod-backup-${{ github.ref_name || github.run_id }}
          path: ${{ steps.backup_prod.outputs.backup_dir }}/*
          retention-days: 90

      - name: "🚀 Deploy Migrations to Production (quartett-prod)"
        id: deploy_prod
        run: |
          echo "=== 🚀 Starting Production Database Deployment ==="
          echo "📤 Applying migrations via supabase db push..."
          set -o pipefail
          if supabase db push --help 2>&1 | grep -q -- '--project-ref'; then
            supabase db push --project-ref "$SUPABASE_PROJECT_REF_PROD" 2>&1 | tee /tmp/supabase_push_prod.log
          else
            supabase db push 2>&1 | tee /tmp/supabase_push_prod.log
          fi
          echo "✅ Production database deployment completed."

      - name: "📢 Generate Production Deployment Summary"
        if: always() && steps.deploy_prod.conclusion != 'skipped'
        run: |
          echo "## 🚀 Supabase Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Wert |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ziel-Umgebung** | \`quartett-prod\` (Production) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Project Ref** | \`${{ secrets.SUPABASE_PROJECT_REF_PROD || vars.SUPABASE_PROJECT_REF_PROD || 'Nicht konfiguriert' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auslöser (Event)** | \`${{ github.event_name }}\` (\`${{ github.ref_name }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backup-Status** | ${{ steps.backup_prod.outcome == 'success' && '💾 Erfolgreich erstellt & als Artifact archiviert (90 Tage)' || '⚠️ Backup fehlgeschlagen' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment-Status** | ${{ steps.deploy_prod.outcome == 'success' && '🟢 Erfolgreich deployt' || '❌ Fehler beim Deployment' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/supabase_push_prod.log ]; then
            echo "### 📜 Status der Migrationen & CLI Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat /tmp/supabase_push_prod.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
